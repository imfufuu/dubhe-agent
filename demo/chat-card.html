<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dubhe Agent 对话区（首页示例）</title>
<link rel="stylesheet" href="../css/styles.css?v=2026.10.11.1" />
<link rel="stylesheet" href="../fonts/literary.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: transparent; }
  .card-root { height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
  .card-root [hidden] { display: none !important; }
  .demo-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; color: var(--fg-3); font-size: 11px; border-bottom: 1px solid var(--line); }
  .demo-bar button { border: 0; background: none; color: var(--fg-2); font: inherit; cursor: pointer; }
  .card-root .messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 16px; scroll-behavior: auto; }
  .card-root .composer-wrap { flex: 0 0 auto; }
  .card-root .composer { min-height: 48px; }
  .card-root #composer-input { font-size: 12px; line-height: 1.6; min-height: 20px; max-height: 70px; }
  .card-root .edit-preview .ep-body { max-height: 140px; }
  .demo-stream::after { content: ''; display: inline-block; width: 2px; height: 1em; margin-left: 3px; background: currentColor; vertical-align: -.1em; animation: blink 1s steps(1) infinite; }
  .demo-toggle { cursor: pointer; }
  .demo-toggle:focus-visible { outline: 2px solid var(--fg-3); outline-offset: 3px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { .demo-stream::after { animation: none; } }
</style>
</head>
<body>
<div class="card-root">
  <div class="demo-bar"><span id="demo-status" role="status">Agent 运行演示 · 模拟数据</span><button id="demo-replay" type="button">↻ 重播</button></div>
  <div class="messages" id="messages" aria-label="Agent 演示对话"></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="composer-input" rows="1" readonly aria-label="演示用户逐字输入" placeholder="你出想法，Dubhe 来实现"></textarea>
      <button id="send-btn" type="button" disabled title="自动发送演示" aria-label="演示自动发送"><span id="send-ico">↑</span></button>
    </div>
    <div class="composer-hint">模拟运行，不调用模型或实际执行工具</div>
  </div>
</div>
<script type="module" src="../js/home-demo.js?v=2026.10.11.1"></script>
</body>
</html>
