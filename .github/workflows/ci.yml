name: CI

# 精简版：每个保留的测试一个 step，统一经 tools/run-tests.mjs 执行（计数写入 job summary）。
# 本地复现：`npm ci && npm test`。

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 测试 + 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖（jsdom）
        run: npm ci
      - name: '语法检查（js/*.js relay/*.js sw.js tools/*.mjs）'
        run: |
          for f in js/*.js relay/*.js sw.js tools/*.mjs; do node --check "$f" || exit 1; done
          echo "全部 JS 模块语法通过"
      - name: 服务端语法检查（python3 -m py_compile server.py）
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs server.py
      - name: tests/server_checks.py · 中继护栏自检
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/server_checks.py
      - name: tests/sandbox_server_checks.py · 本地网页项目与 API 安全边界
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/sandbox_server_checks.py
      - name: tests/agent.test.mjs · 主单测
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/agent.test.mjs
      - name: tests/local-cpp-policy.test.mjs · 本地 C++ 策略、工具门控与无网络集成
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/local-cpp-policy.test.mjs
      - name: tests/local-cpp.test.mjs · 本地 C++ WASM 多文件编译执行
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/local-cpp.test.mjs
      - name: tests/input-system-fixes.test.mjs · 输入区布局 / 浮层定位 / LOCAL 标签 / C++ 进度 / /system 补全
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/input-system-fixes.test.mjs
      - name: tests/wllama-abort-compat.test.mjs · Wllama 取消兼容
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/wllama-abort-compat.test.mjs
      - name: tests/app-boot.mjs · 应用装配冒烟
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/app-boot.mjs
      - name: tests/composer-newline-guard.test.mjs · 换行与发送键行为
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/composer-newline-guard.test.mjs
      - name: tests/local-text-policy.test.mjs · 本地文本审核规则
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/local-text-policy.test.mjs
      - name: tests/text-moderation-bypass.test.mjs · 文本审核规避写法回归
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/text-moderation-bypass.test.mjs
      - name: tests/tools-v19.test.mjs · V1.9 工具（patch_apply / dom_inspect / chart_render）
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/tools-v19.test.mjs
      - name: tests/moderation-prewarm.test.mjs · 图像审核按需加载，避免与本地 C++ 抢内存
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/moderation-prewarm.test.mjs
      - name: tests/user-salutation.test.mjs · 本地称谓审核与状态
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/user-salutation.test.mjs
      - name: tests/dom-smoke.mjs · DOM 冒烟
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/dom-smoke.mjs
      - name: tests/edit-demo.test.mjs · 文件差异与导航演示回归
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/edit-demo.test.mjs
      - name: tests/gateway-models.test.mjs · 网关模型目录与手动 ID 规则
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/gateway-models.test.mjs
      - name: tests/gguf.test.mjs · GGUF 元数据与内存估算
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/gguf.test.mjs
      - name: tests/github-project.test.mjs · GitHub 项目 ZIP 导入与 Worker 路由
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/github-project.test.mjs
      - name: tests/i18n.test.mjs · 多语言基础与 Intl 格式
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/i18n.test.mjs
      - name: tests/offline-model.test.mjs · 离线模型、工具白名单与网络围栏
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/offline-model.test.mjs
      - name: tests/page-fx.test.mjs · 页面动效安全与减少动效
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/page-fx.test.mjs
      - name: tests/svg-safety.test.mjs · SVG 安全清理与本地文本提取
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/svg-safety.test.mjs
      - name: tests/ui-adjustments.test.mjs · 本轮 UI 与流式修复回归
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/ui-adjustments.test.mjs
      - name: tests/ui-chunks.test.mjs · 流式 Markdown 尾文本浮现
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/ui-chunks.test.mjs
      - name: tests/ui-foot.test.mjs · Assistant 脚注与元信息
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/ui-foot.test.mjs
      - name: tests/ui-motion-new.test.mjs · 新版 UI 动效回归
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/ui-motion-new.test.mjs
      - name: tests/ui-runtime.test.mjs · 演示动效与 Python 按需依赖
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/ui-runtime.test.mjs
      - name: tests/ui-turn-toolbar.test.mjs · 单轮工具栏
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/ui-turn-toolbar.test.mjs
      - name: tests/reasoning-rhythm.test.mjs · 模型努力映射与消息间距
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/reasoning-rhythm.test.mjs
      - name: V1.8 static preview and shared motion
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/v18-preview.test.mjs
      - name: Manifest-based incremental static cache
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/static-cache.test.mjs
      - name: Discoverable document skills and audio analysis
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/document-skills.test.mjs
      - name: V1.8.1 fixes — thinking, command merge, skill loop, file tools
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/v181-fixes.test.mjs

      - name: tests/v19-features.test.mjs · V1.9 直连/文件卡片/Office 预览/全屏/OG/音视频合并
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/v19-features.test.mjs

      - name: '汇总测试计数（::notice:: + job summary）'
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs --summary
