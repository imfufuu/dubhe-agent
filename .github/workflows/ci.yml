name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check · js / relay / sw / tools
        run: |
          for f in js/*.js relay/*.js sw.js tools/*.mjs; do node --check "$f" || exit 1; done
      - name: i18n audit
        run: node scripts/i18n-audit.mjs --json
      - name: tests/agent-runtime.test.mjs · regression
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/agent-runtime.test.mjs
      - name: tests/agent.test.mjs · regression
        if: ${{ !cancelled() }}
        run: node tools/run-tests.mjs tests/agent.test.mjs
